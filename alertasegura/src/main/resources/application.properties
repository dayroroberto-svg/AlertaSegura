# ============================================================
# ALERTASEGURA - CONFIGURACIÓN
# ============================================================

spring.application.name=alertasegura

# Perfil por defecto: usa application-local.properties (ver .example)
spring.profiles.active=local

# ============================================================
# MYSQL - Conexión a base de datos
# ============================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/alertasegura?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# JPA / HIBERNATE
# ============================================================
# El esquema se administra mediante database/schema.sql y migraciones explícitas.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ============================================================
# SERVIDOR
# ============================================================
server.port=8080

# ============================================================
# JWT - Configuración de tokens
# ============================================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ============================================================
# CORS
# ============================================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# ============================================================
# EVIDENCIAS
# ============================================================
app.uploads.dir=${UPLOADS_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
