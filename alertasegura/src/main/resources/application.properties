# ============================================================
# ALERTASEGURA - CONFIGURACIÓN
# ============================================================

spring.application.name=alertasegura

# ============================================================
# MYSQL - Conexión a base de datos
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/alertasegura?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=dayro123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# JPA / HIBERNATE
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ============================================================
# SERVIDOR
# ============================================================
server.port=8080

# ============================================================
# JWT - Configuración de tokens
# ============================================================
app.jwt.secret=AlertaSeguraJWTSecretKey2024MuySeguraConMasDe256BitsParaHMACSHA256
app.jwt.expiration-ms=86400000

# ============================================================
# CORS
# ============================================================
app.cors.allowed-origins=http://localhost:4200
