<div class="adm">
  <aside class="adm-sidebar">
    <div style="padding: 24px 20px 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.08)">
      <div style="display: flex; align-items: center; gap: 10px">
        <div style="width: 36px; height: 36px; background: #dc2626; border-radius: 8px; display: flex; align-items: center; justify-content: center">
          <app-admin-icon name="shield" [size]="20" color="white" />
        </div>
        <div>
          <div style="color: white; font-weight: 700; font-size: 16px; line-height: 1.1">AlertaSegura</div>
          <div style="color: #94aab8; font-size: 11px; font-weight: 500">Panel Administrativo</div>
        </div>
      </div>
    </div>

    <nav style="flex: 1; padding: 16px 12px; display: flex; flex-direction: column; gap: 4px">
      @for (item of menu; track item.key) {
        <a class="sidebar-item" [class.active]="activo() === item.key" [routerLink]="item.ruta">
          <app-admin-icon [name]="item.icon" [size]="18" />
          {{ item.label }}
        </a>
      }
    </nav>

    <div style="padding: 16px 20px; border-top: 1px solid rgba(255, 255, 255, 0.08)">
      <div style="display: flex; align-items: center; gap: 10px">
        <div style="width: 34px; height: 34px; border-radius: 50%; background: var(--sidebar-active); display: flex; align-items: center; justify-content: center; flex-shrink: 0">
          <app-admin-icon name="user" [size]="16" color="white" />
        </div>
        <div style="min-width: 0">
          <div style="color: white; font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{ nombre() }}</div>
          <div style="color: #94aab8; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{ correo() }}</div>
        </div>
      </div>
      <button
        class="sidebar-item"
        type="button"
        (click)="cerrarSesion()"
        style="width: 100%; margin-top: 14px; background: none; border: 0; font-family: inherit; text-align: left"
      >
        <app-admin-icon name="logout" [size]="18" />
        Cerrar sesión
      </button>
    </div>
  </aside>

  <div class="adm-main">
    <router-outlet />
  </div>
</div>
