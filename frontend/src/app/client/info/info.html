<main class="info-container">
  <header class="page-header">
    <h1>{{ pagina().titulo }}</h1>
    <p>{{ pagina().subtitulo }}</p>
  </header>

  <div class="info-card">
    @for (seccion of pagina().secciones; track seccion.titulo) {
    <section>
      <h2>{{ seccion.titulo }}</h2>
      @for (parrafo of seccion.parrafos; track $index) {
      <p>{{ parrafo }}</p>
      }
    </section>
    }
  </div>

  <nav class="info-links" aria-label="Otras páginas de soporte">
    <a routerLink="/ayuda">Centro de ayuda</a>
    <a routerLink="/terminos">Términos de uso</a>
    <a routerLink="/privacidad">Privacidad</a>
    <a routerLink="/accesibilidad">Accesibilidad</a>
  </nav>
</main>
